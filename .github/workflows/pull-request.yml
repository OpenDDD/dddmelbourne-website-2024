name: pull-request.yml
on:
  pull_request:
    branches:
      - main
jobs:
  test_and_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20.9.0'
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run build
